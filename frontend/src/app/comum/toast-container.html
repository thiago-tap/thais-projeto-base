<div class="pointer-events-none fixed right-4 top-4 z-50 flex w-full max-w-sm flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto rounded-md border-2 px-4 py-3 text-sm font-semibold shadow-[4px_4px_0_0_var(--cor-tinta)]"
      [class]="
        toast.tipo === 'sucesso'
          ? 'border-emerald-800 bg-emerald-50 text-emerald-900'
          : toast.tipo === 'erro'
            ? 'border-[var(--cor-destaque)] bg-red-50 text-[var(--cor-destaque)]'
            : 'border-[var(--cor-tinta)] bg-white text-[var(--cor-tinta)]'
      "
      role="status"
    >
      <div class="flex items-start justify-between gap-3">
        <span>{{ toast.mensagem }}</span>
        <button
          type="button"
          class="text-xs underline"
          (click)="toastService.fechar(toast.id)"
        >
          Fechar
        </button>
      </div>
    </div>
  }
</div>
