<footer class="mt-auto border-t-2 border-[var(--cor-tinta)] bg-[var(--cor-papel-forte)]">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-5 text-sm">
    <div>
      <p class="font-display text-base font-semibold">Painel de Usuários</p>
      <p class="text-[var(--cor-tinta-suave)]">
        Projeto didático Angular + NestJS · {{ anoAtual }}
      </p>
    </div>

    <nav class="flex flex-wrap items-center gap-3" aria-label="Links do rodapé">
      <a
        routerLink="/inicio"
        class="inline-flex items-center gap-1 font-semibold text-[var(--cor-tinta)] underline-offset-2 hover:underline"
      >
        <ng-icon name="lucideLayoutDashboard" size="0.95rem" />
        Início
      </a>
      <a
        routerLink="/sobre"
        class="inline-flex items-center gap-1 font-semibold text-[var(--cor-tinta)] underline-offset-2 hover:underline"
      >
        <ng-icon name="lucideBookOpen" size="0.95rem" />
        Sobre a aula
      </a>
      <a
        routerLink="/usuarios"
        class="inline-flex items-center gap-1 font-semibold text-[var(--cor-tinta)] underline-offset-2 hover:underline"
      >
        <ng-icon name="lucideUsers" size="0.95rem" />
        Usuários
      </a>
    </nav>
  </div>
</footer>
